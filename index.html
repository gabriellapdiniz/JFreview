{r:0,t:'Complete: Yesterday, we ___ a leak.',o:['find','found','are finding'],a:1,e:'Yesterday pede passado simples; find → found.'},
{r:0,t:'Verdadeiro ou falso: “I am checking the panel now” descreve uma atividade em andamento.',type:'tf',o:['Verdadeiro','Falso'],a:0,e:'Am/is/are + verbo com -ing apresenta uma ação em andamento.'},
{r:1,t:'Você recebe a instrução “Inspect the connector and report any damage.” O que precisa comunicar ao colega?',o:['Inspect the connector and report any damage.','Replace the connector and ignore the damage.','The connector was replaced yesterday.'],a:0,e:'A primeira opção mantém o sentido da instrução. Observe os verbos “inspect” e “report”.'},
{r:1,t:'Complete: We need to ___ the landing gear.',o:['inspect','inspected','inspecting'],a:0,e:'Depois de “need to”, use o verbo na forma base: inspect.'},
{r:1,t:'O supervisor diz: “Pay attention to the inspection notes.” O que ele pede?',o:['Preste atenção às anotações da inspeção.','Pague pelas anotações da inspeção.','Prepare uma inspeção nova.'],a:0,e:'“Pay attention to” significa prestar atenção a algo.'},
{r:1,t:'Qual frase usa corretamente a expressão “make a mistake”?',o:['I made a mistake in the report.','I did a mistake in the report.','I took a mistake in the report.'],a:0,e:'A combinação estudada é “make a mistake”; no passado: “made a mistake”.'},
{r:1,t:'Qual frase comunica problema e localização com clareza?',o:['Something is bad there.','We identified corrosion on the lower panel.','There is a thing somewhere.'],a:1,e:'A frase nomeia o achado e informa onde ele foi identificado.'},
{r:1,t:'Observe a foto. Diga em inglês o que você consegue ver, o que ainda não dá para afirmar e o que precisaria verificar para entender a marca.',img:'images/panel-inspection.webp',type:'write',model:'I can see a small mark near the access panel. I cannot identify its cause from the photo. I need to inspect the area more closely.',e:'Aceite observações diferentes. Valorize “I can see...”, “It may be...”, “I cannot confirm...” e “I need to check...”. A foto não confirma uma falha.'},
{r:1,t:'Toque na palavra incorreta: “Yesterday we inspect the connector.”',type:'spot',o:['Yesterday','we','inspect','the','connector'],a:2,e:'Yesterday indica passado: “Yesterday we inspected the connector.”'},
{r:2,t:'Qual frase relata uma ação concluída em estilo de relatório?',o:['The filter was replaced and the system was tested.','The filter replacing and the system testing.','The filter will maybe do something.'],a:0,e:'“Was replaced” e “was tested” relatam ações concluídas com clareza.'},
{r:2,t:'Complete: A leak ___ found near the hydraulic line.',o:['were','was','is be'],a:1,e:'“A leak” é singular: “A leak was found”.'},
{r:2,t:'Organize a informação de um registro: achado → ação → resultado.',o:['A leak was found. The seal was replaced. The system was tested.','The system was tested. A leak was found. The seal was replaced.','The seal was replaced. The system was tested. A leak was found.'],a:0,e:'Essa sequência torna o relato fácil de acompanhar: o que foi encontrado, feito e verificado.'},
{r:2,t:'Uma instrução escrita diz “The system must be tested.” Qual palavra expressa obrigação?',o:['system','must','tested'],a:1,e:'“Must” expressa obrigação na frase; a questão avalia o sentido da palavra.'},
{r:2,t:'A instrução diz “Do not install the damaged component.” Qual frase mantém a proibição?',o:['The damaged component should be installed.','The damaged component must not be installed.','The damaged component does not have to be installed.'],a:1,e:'“Must not” expressa proibição; “does not have to” indica apenas que não é necessário.'},
{r:2,t:'Observe a foto. Escreva uma nota curta de observação: o que aparece, onde aparece e o que ainda precisa ser verificado. Não afirme uma causa que a imagem não mostra.',img:'images/panel-mark.webp',type:'write',model:'An uneven mark was observed near the panel seam. The cause has not been confirmed. The area needs to be checked more closely.',e:'Avalie a precisão do inglês e a diferença entre observação e hipótese. Modelos com “appears to be” também são possíveis.'},
{r:2,t:'Qual frase comunica a informação de modo inadequado em um relatório?',type:'wrong',o:['A mark was observed near the panel seam.','The area was inspected yesterday.','We is checking the area now.'],a:2,e:'“We is” não concorda. Use “We are checking...” para a atividade atual.'},
{r:3,t:'Compare: This crack is ___ than the one described in the previous report.',o:['large','larger','largest'],a:1,e:'Para comparar duas coisas: larger than.'},
{r:3,t:'Complete: Of the three reports, this is the ___ one.',o:['more detailed','most detailed','detailed than'],a:1,e:'Ao destacar um entre três: “the most detailed”.'},
{r:3,t:'Qual atualização comunica tarefa atual e próximo passo?',o:['I am checking the record now. I will send you an update after I finish.','Me busy. Later.','I checked tomorrow and I update yesterday.'],a:0,e:'A resposta combina presente contínuo e uma próxima ação em frases completas.'},
{r:3,t:'Antes de continuar a atividade, o colega quer fazer uma pausa. Qual expressão você usa?',o:['make a break','take a break','do a break'],a:1,e:'A expressão estudada é “take a break”.'},
{r:3,t:'Observe a foto e mande uma mensagem curta em inglês para outro técnico: descreva o que chama sua atenção, apresente uma possibilidade com “may” ou “could” e diga o que você precisa verificar antes de concluir.',img:'images/line-fitting.webp',type:'write',model:'I can see a slight sheen near the line connection. It could be residue, but I cannot confirm the source from the photo. I need to check the area more closely.',e:'O objetivo é comunicar observação, possibilidade e necessidade de verificação em inglês, sem fechar um diagnóstico.'},
{r:3,t:'Desafio oral: diga uma tarefa que você faz regularmente, uma que está fazendo agora e uma que concluiu ontem. Use tarefas verdadeiras da sua função.',type:'write',model:'I inspect components regularly. I am checking a maintenance record now. Yesterday, I inspected a panel and reported the finding.',e:'Compare presente simples, presente contínuo e passado simples. As tarefas podem variar conforme cada profissional.'},
{r:3,t:'Associe cada situação à frase em inglês que a comunica com clareza.',type:'match',o:['Rotina','Agora','Ontem'],pairs:['I inspect the area every morning.','I am inspecting the area now.','I inspected the area yesterday.'],a:[0,1,2],e:'Every morning → presente simples; now → presente contínuo; yesterday → passado simples.'}
];
const el=document.getElementById('app');
const teacher=new URLSearchParams(location.search).has('teacher');
const params=new URLSearchParams(location.search);
const room=teacher?(sessionStorage.getItem('jf-review-room')||(()=>{const v='jf-review-'+crypto.randomUUID().slice(0,12);sessionStorage.setItem('jf-review-room',v);return v})()):(params.get('room')||'');
let idx=-1,revealed=false,peer=null,conn=null,peers=[],connected=false,choice=null,answers={},written={},retry=null;
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const studentURL=location.origin+location.pathname+'?room='+encodeURIComponent(room);
let qrReady=false;
if(teacher){const qrScript=document.createElement('script');qrScript.src='qrcode.min.js';qrScript.onload=()=>{qrReady=true;render()};document.head.appendChild(qrScript)}
const peerScript=document.createElement('script');peerScript.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';peerScript.onload=()=>{if(room)setup()};peerScript.onerror=()=>{document.getElementById('status').textContent='Conexão indisponível. Verifique a internet e atualize a página.'};document.head.appendChild(peerScript);
function setup(){
 if(teacher){peer=new Peer(room);peer.on('open',()=>{connected=true;render()});peer.on('connection',c=>{peers.push(c);c.on('open',()=>{c.send({type:'state',idx,revealed});render()});c.on('data',m=>{if(m?.type==='answered'&&Number.isInteger(m.idx))answers[c.peer]=m.idx;render()});c.on('close',()=>{peers=peers.filter(x=>x!==c);delete answers[c.peer];render()})});peer.on('error',e=>{connected=false;render();if(e.type==='unavailable-id'){sessionStorage.removeItem('jf-review-room');el.insertAdjacentHTML('afterbegin','<div class="feedback bad">Esta sala já está ocupada. <button class="btn" id="new-room">Criar outra sala</button></div>');document.getElementById('new-room').onclick=()=>location.reload()}});peer.on('disconnected',()=>{connected=false;render();setTimeout(()=>{if(peer&&!peer.destroyed&&peer.disconnected)peer.reconnect()},2500)})}
 else{peer=new Peer();peer.on('open',connectStudent);peer.on('disconnected',()=>{connected=false;render();setTimeout(()=>{if(peer&&!peer.destroyed&&peer.disconnected)peer.reconnect()},2500)});peer.on('error',()=>{connected=false;render()});retry=setInterval(()=>{if(peer?.open&&!conn?.open)connectStudent()},5000)}
}
function connectStudent(){if(conn?.open)return;try{conn?.close();conn=peer.connect(room,{reliable:true});conn.on('open',()=>{connected=true;conn.send({type:'hello'});render()});conn.on('data',m=>{if(m?.type==='state'&&Number.isInteger(m.idx)&&m.idx>=-1&&m.idx<=q.length){let changed=idx!==m.idx;idx=m.idx;revealed=!!m.revealed;if(changed)choice=null;render()}});conn.on('close',()=>{connected=false;render()});conn.on('error',()=>{connected=false;render()})}catch(e){connected=false;render()}}
function sendState(){for(const c of peers)if(c.open)c.send({type:'state',idx,revealed});render()}
function statusText(){return teacher?(connected?`Sala ativa · ${peers.filter(x=>x.open).length} celular(es) conectado(s)`:'Conectando a sala da professora…'):(connected?'Conectado à aula · aguarde o comando da professora':room?'Aguardando conexão com a professora… Mantenha esta página aberta.':'Escaneie o QR code exibido no notebook da professora para entrar na sala.')}
function labels(){document.getElementById('rounds').innerHTML=rounds.map((x,i)=>`<div class="round ${idx>=0&&idx<q.length&&q[idx].r===i?'active':''} ${idx>=0&&idx<q.length&&q[idx].r>i?'done':''}">${x}</div>`).join('')}
function render(){labels();let status=`<div id="status" class="live-status ${connected?'online':''}" role="status">${statusText()}</div>`;
 if(idx<0){el.innerHTML=`<div class="eyebrow">${teacher?'Painel da professora':'Revisão interativa'}</div><h1>Missão no Hangar</h1><p>${teacher?'Abra esta página no notebook e deixe a aba aberta durante a aula. Os alunos acessam pelo QR code abaixo. Você conduz cada questão e libera a resposta.':'Entre pelo QR code e aguarde a professora iniciar. Responda no celular; a correção aparecerá quando ela liberar.'}</p>${status}${teacher?`<div class="qr-access"><div id="live-qr" aria-label="QR Code da sala dos alunos"></div><div><strong>Entrada dos alunos</strong><p class="small">Escaneie este QR code para entrar nesta sala. <a href="${escapeHTML(studentURL)}">Link direto para os alunos</a></p></div></div><div class="controls"><span class="small">Seu painel: ${escapeHTML(location.origin+location.pathname)}?teacher=1</span><button class="btn" id="start" ${connected?'':'disabled'}>Iniciar revisão</button></div>`:'<div class="feedback">As respostas ficam ocultas até a professora clicar em “Mostrar resposta”.</div>'}`;if(teacher){if(qrReady)new QRCode(document.getElementById('live-qr'),{text:studentURL,width:154,height:154,colorDark:'#1f2e29',colorLight:'#ffffff'});if(connected)document.getElementById('start').onclick=()=>{idx=0;revealed=false;answers={};sendState()}}return}
 if(idx>=q.length){el.innerHTML=`<div class="eyebrow">Missão concluída</div><h1>Revisão finalizada</h1><p>Vocês praticaram inglês para descrever rotinas, ações em andamento, eventos passados, observações e registros de manutenção.</p>${status}${teacher?'<button class="btn" id="again">Recomeçar com a turma</button>':'<div class="feedback">Obrigado por participar! Converse com a professora sobre as frases que gostaria de praticar novamente.</div>'}`;if(teacher)document.getElementById('again').onclick=()=>{idx=-1;revealed=false;answers={};sendState()};return}
 const z=q[idx],type=z.type||'choice',saved=choice?.idx===idx?choice.value:null;
 const hasAnswer=type==='match'?(Array.isArray(saved)&&choice?.submitted===true):saved!==null;
 const right=hasAnswer&&(type==='match'?z.a.every((v,i)=>saved[i]===v):saved===z.a);
 let input='';
 if(type==='write')input=`<textarea class="answer" id="written" aria-label="Sua resposta" placeholder="Escreva aqui uma possibilidade em inglês..." ${teacher?'disabled':''}>${escapeHTML(written[idx]||'')}</textarea>`;
 else if(type==='match')input=`<div class="match-grid">${z.o.map((v,i)=>`<label class="${revealed&&!teacher&&hasAnswer&&saved[i]!==z.a[i]?'match-wrong':''}">${escapeHTML(v)}<select data-match="${i}" ${teacher||revealed?'disabled':''}><option value="">Escolha uma frase</option>${z.pairs.map((p,j)=>`<option value="${j}" ${saved?.[i]===j?'selected':''}>${escapeHTML(p)}</option>`).join('')}</select></label>`).join('')}</div><button class="btn" id="save-match" ${teacher||revealed?'disabled':''}>Registrar associação</button>`;
 else input=`<div class="options ${type==='spot'?'words':''}">${z.o.map((v,i)=>`<button class="option ${saved===i?'selected':''} ${revealed&&z.a===i?'correct':''} ${revealed&&!teacher&&saved===i&&saved!==z.a?'wrong':''}" data-choice="${i}" ${teacher||revealed?'disabled':''}>${type==='spot'?escapeHTML(v):type==='tf'?escapeHTML(v):`${String.fromCharCode(65+i)}. ${escapeHTML(v)}`}</button>`).join('')}</div>`;
 let verdict=revealed&&!teacher&&type!=='write'?(hasAnswer?(right?'<div class="feedback good"><strong>GOOD JOB! ✓</strong> Você acertou!</div>':'<div class="feedback bad"><strong>Vamos corrigir juntos.</strong> Sua resposta está destacada em vermelho; confira a resposta correta abaixo.</div>'):'<div class="feedback">Você não registrou uma resposta nesta questão. Veja a correção abaixo.</div>'):'';
 let feedback=revealed?`${verdict}<div class="feedback"><strong>${type==='write'?'Modelo possível':type==='spot'?'Palavra a corrigir':type==='wrong'?'Frase inadequada':'Resposta comentada'}:</strong> ${type==='write'?`<div class="model">${escapeHTML(z.model)}</div>`:type==='match'?`<div class="model">${z.o.map((v,i)=>`${escapeHTML(v)} → ${escapeHTML(z.pairs[z.a[i]])}`).join('<br>')}</div>`:type==='spot'?`<b>${escapeHTML(z.o[z.a])}</b>`:type==='tf'?`<b>${escapeHTML(z.o[z.a])}</b>`:`<b>${escapeHTML(z.o[z.a])}</b>`}<br>${escapeHTML(z.e)}</div>`:hasAnswer||written[idx]?`<div class="feedback">Resposta registrada. Aguarde a correção em conjunto.</div>`:'';
 el.innerHTML=`<div class="eyebrow">${escapeHTML(rounds[z.r])} · Questão ${idx+1} de ${q.length}</div>${status}<div class="bar"><div style="width:${idx/q.length*100}%"></div></div><h1>${escapeHTML(z.t)}</h1>${z.img?`<figure class="scenario-photo"><img src="${escapeHTML(z.img)}" alt="Cena ilustrativa para descrever observações em inglês"><figcaption>Imagem ilustrativa · descreva apenas o que é possível observar.</figcaption></figure>`:''}${input}${feedback}${teacher?`<div class="controls"><span class="small">${Object.values(answers).filter(v=>v===idx).length} resposta(s) registrada(s) nesta questão</span><button class="btn" id="reveal" ${revealed?'disabled':''}>Mostrar resposta</button><button class="btn ghost" id="next" ${revealed?'':'disabled'}>${idx===q.length-1?'Finalizar':'Próxima questão →'}</button></div>`:!revealed?'<p class="small">Escolha uma resposta. Você pode alterá-la até a professora revelar.</p>':'<p class="small">Converse com a turma sobre a correção. A professora avança a questão.</p>'}`;
 if(teacher){document.getElementById('reveal').onclick=()=>{revealed=true;sendState()};document.getElementById('next').onclick=()=>{idx++;revealed=false;answers={};choice=null;sendState()};return}
 if(type==='write'){let w=document.getElementById('written');w.oninput=()=>{written[idx]=w.value;if(conn?.open)conn.send({type:'answered',idx});let f=el.querySelector('.feedback');if(!f&&w.value){let n=document.createElement('div');n.className='feedback';n.textContent='Resposta registrada. Aguarde a correção em conjunto.';w.after(n)}}}
 else if(type==='match'){el.querySelectorAll('[data-match]').forEach(select=>select.onchange=()=>{choice={idx,value:[...el.querySelectorAll('[data-match]')].map(x=>x.value===''?null:Number(x.value))}});document.getElementById('save-match').onclick=()=>{if(choice?.idx===idx&&choice.value.every(x=>x!==null)){choice.submitted=true;conn?.send({type:'answered',idx});render()}else alert('Associe as três situações antes de registrar.')}}
 else el.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice={idx,value:Number(b.dataset.choice)};conn?.send({type:'answered',idx});render()});
}
render();
</script></body></html>
