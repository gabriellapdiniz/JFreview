];let idx=-1,score=0,selected=null,seen=[],written=[];const el=document.getElementById('app');const labels=()=>document.getElementById('rounds').innerHTML=rounds.map((x,i)=>`<div class="round ${idx>=0&&q[Math.min(idx,q.length-1)].r===i?'active':''} ${idx>=0&&q[Math.min(idx,q.length-1)].r>i?'done':''}">${x}</div>`).join('');function render(){labels();if(idx<0){el.innerHTML=`<div class="eyebrow">Revisão interativa</div><h1>Missão no Hangar</h1><p>24 desafios sobre o inglês que usamos nas aulas: rotina, ações em andamento, passado, vocabulário técnico, relatórios e comunicação no hangar.</p><p>Respondam juntos ou cada um no próprio celular. Nas duas últimas questões, escrevam e comparem com o modelo — a professora conduz a correção.</p><div class="controls"><span class="small">Sem cadastro. O resultado fica apenas neste aparelho.</span><button class="btn" id="start">Começar missão</button></div>${qrMarkup}`;document.getElementById('start').onclick=()=>{idx=0;render()};return}if(idx>=q.length){el.innerHTML=`<div class="eyebrow">Missão concluída</div><h1>Revisão finalizada</h1><div class="score">${score} / 22</div><p>Acertos nas questões objetivas. As duas respostas abertas são corrigidas com a professora.</p><div class="feedback"><strong>Para revisar em voz alta:</strong> peça uma frase sobre rotina, outra sobre uma tarefa em andamento e um registro curto sobre uma tarefa concluída.</div><button class="btn" id="again">Jogar novamente</button>`;document.getElementById('again').onclick=()=>{idx=-1;score=0;seen=[];written=[];render()};return}let z=q[idx],done=!!seen[idx],isWrite=z.type==='write';el.innerHTML=`<div class="eyebrow">${rounds[z.r]} · Questão ${idx+1} de ${q.length}</div><div class="bar" role="progressbar" aria-valuenow="${idx}" aria-valuemin="0" aria-valuemax="${q.length}"><div style="width:${idx/q.length*100}%"></div></div><h1>${z.t}</h1>${isWrite?`<textarea class="answer" id="written" aria-label="Sua resposta" placeholder="Escreva sua resposta aqui..."></textarea><div class="controls"><span class="small">Resposta aberta · correção com a professora</span><button class="btn" id="reveal">Ver modelo</button></div>`:`<div class="options">${z.o.map((v,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div>`}<div id="feed"></div><div class="controls"><span class="small">${isWrite?'Responda antes de ver o modelo.':'Escolha uma resposta para continuar.'}</span><button class="btn" id="next" ${done?'':'disabled'}>${idx===q.length-1?'Ver resultado':'Próxima questão →'}</button></div>`;document.getElementById('next').onclick=()=>{idx++;render()};if(isWrite){document.getElementById('written').value=written[idx]||'';document.getElementById('written').oninput=e=>written[idx]=e.target.value;document.getElementById('reveal').onclick=()=>{seen[idx]=true;document.getElementById('feed').innerHTML=`<div class="feedback"><strong>Modelo possível:</strong><div class="model">${z.model}</div><br>${z.e}</div>`;document.getElementById('next').disabled=false;document.getElementById('reveal').disabled=true};return}document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(seen[idx])return;seen[idx]=true;let n=Number(b.dataset.choice);if(n===z.a)score++;document.querySelectorAll('[data-choice]').forEach(c=>{c.disabled=true;if(Number(c.dataset.choice)===z.a)c.classList.add('correct');else if(c===b)c.classList.add('wrong')});document.getElementById('feed').innerHTML=`<div class="feedback ${n===z.a?'':'bad'}"><strong>${n===z.a?'Correto!':'Boa tentativa.'}</strong> ${z.e}</div>`;document.getElementById('next').disabled=false})}render();
