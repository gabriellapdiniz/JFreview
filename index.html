<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missão no Hangar · Revisão JF Aviation</title><meta name="description" content="Quiz de revisão de inglês para técnicos da JF Aviation"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23222b2b'/%3E%3Cpath d='M12 33h40M32 13v38' stroke='%238fc64a' stroke-width='5'/%3E%3C/svg%3E"><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172423;background:#eef2ec}*{box-sizing:border-box}body{margin:0}header{background:#182526;color:white;padding:18px 24px;border-bottom:5px solid #97bd52}header .inner{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{letter-spacing:.08em;font-size:14px}header span{font-size:14px;color:#d7e3d1}main{max-width:1000px;margin:28px auto;padding:0 20px 55px}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px}.side,.card{background:white;border:1px solid #d8e1d8;border-radius:18px;box-shadow:0 8px 32px #1724230b}.side{padding:22px;align-self:start}.side h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 18px;color:#47615b}.round{padding:11px 0;border-top:1px solid #e6ebe4;color:#677671;font-size:14px}.round.active{color:#1d3d37;font-weight:800}.round.done{color:#426b23}.card{padding:38px 42px;min-height:460px}.eyebrow{text-transform:uppercase;color:#517c34;font-weight:800;letter-spacing:.13em;font-size:13px}.card h1{font-size:clamp(27px,4vw,43px);line-height:1.12;letter-spacing:-.04em;margin:15px 0}.card p{font-size:17px;line-height:1.55;color:#52615c}.bar{height:8px;background:#e7ede4;border-radius:20px;overflow:hidden;margin:24px 0}.bar>div{height:100%;background:#8db843;transition:width .25s}.options{display:grid;gap:12px;margin:24px 0}.option{width:100%;text-align:left;padding:17px 19px;background:#f7f9f5;color:#21342d;border:2px solid #dce5db;border-radius:12px;font-size:16px;line-height:1.35;cursor:pointer}.option:hover:not(:disabled),.option.selected{border-color:#719d36;background:#eff7e7}.option.correct{border-color:#398760;background:#e4f5e9}.option.wrong{border-color:#b65348;background:#fcece8}.option:disabled{cursor:default}.feedback{border-left:4px solid #80a84c;background:#f2f7ed;padding:15px 18px;border-radius:0 10px 10px 0;line-height:1.5;margin:20px 0}.feedback.bad{border-color:#b65b43;background:#fcf0eb}.controls{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:23px}.btn{background:#253b32;color:#fff;border:0;border-radius:11px;padding:14px 21px;font-size:16px;font-weight:700;cursor:pointer}.btn:hover{background:#365941}.btn:disabled{opacity:.5;cursor:not-allowed}.ghost{background:transparent;color:#43604e;border:1px solid #cddacd}.ghost:hover{background:#edf4e8}.small{font-size:13px;color:#64736d}.answer{width:100%;min-height:120px;border:2px solid #d3dfd2;border-radius:12px;padding:15px;font:inherit;font-size:16px;line-height:1.5;resize:vertical}.answer:focus{outline:3px solid #9dbd7b}.model{white-space:pre-line}.badge{display:inline-block;background:#e8f1dd;color:#315321;padding:8px 12px;border-radius:30px;font-weight:700}.score{font-size:52px;font-weight:800;letter-spacing:-.05em;color:#365b2c}@media(max-width:720px){main{margin:15px auto}.layout{display:flex;flex-direction:column}.side{padding:13px 17px}.side h2{margin-bottom:8px}.round{display:inline-block;border:0;padding:6px 10px 6px 0;font-size:12px}.card{padding:25px 22px;min-height:0}header .inner{align-items:flex-start;flex-direction:column;gap:3px}}</style></head><body><header><div class="inner"><strong>HSL ENGLISH SCHOOL <span>×</span> JF AVIATION</strong><span>English for Aircraft Maintenance · revisão</span></div></header><main><div class="layout"><aside class="side"><h2>Missão no Hangar</h2><div id="rounds"></div><p class="small">24 desafios · aproximadamente 35–45 min</p></aside><section class="card" id="app"></section></div></main><script>
const rounds=['01 · Base e rotina','02 · No hangar','03 · Relatórios','04 · Desafio final'];
const q=[
{r:0,t:'Qual frase apresenta uma função profissional?',o:['I work as an aircraft maintenance technician.','I working as an aircraft maintenance technician.','I am work as an aircraft maintenance technician.'],a:0,e:'Para falar da profissão, use “I work as...” ou “I am a...”.'},
{r:0,t:'Complete: He ___ the maintenance records every morning.',o:['check','checks','is check'],a:1,e:'Com he/she/it no presente simples, o verbo recebe -s: “He checks”.'},
{r:0,t:'Qual pergunta fala de uma rotina?',o:['What are you inspecting right now?','What did you inspect yesterday?','What do you inspect every morning?'],a:2,e:'“Every morning” indica hábito; a pergunta usa do + verbo base.'},
{r:0,t:'Complete: We ___ the aircraft on Saturdays.',o:['does not inspect','do not inspect','are not inspect'],a:1,e:'Com we, a negativa no presente simples é “do not + verbo base”.'},
{r:0,t:'Qual frase descreve uma tarefa em andamento agora?',o:['The mechanic replaces the filter every month.','The mechanic is replacing the filter now.','The mechanic replaced the filter yesterday.'],a:1,e:'“Is replacing” indica uma ação em andamento.'},
{r:0,t:'Complete: Yesterday, the team ___ a hydraulic leak.',o:['find','found','is finding'],a:1,e:'O passado de find é found.'},
{r:1,t:'Coloque as etapas na ordem adequada.',o:['Test → disconnect power → remove panel','Disconnect power → remove panel → inspect wiring → test','Remove panel → test → inspect wiring'],a:1,e:'A sequência do exercício parte da desconexão da energia antes do acesso e termina com o teste. Na prática, sempre prevalece o procedimento aprovado.'},
{r:1,t:'Complete: We need to ___ the landing gear.',o:['inspect','inspected','inspecting'],a:0,e:'Depois de “need to”, use o verbo na forma base: “need to inspect”.'},
{r:1,t:'A team is investigating an electrical fault. Qual expressão combina?',o:['look into','put together','fill out'],a:0,e:'“Look into” significa investigar.'},
{r:1,t:'O que significa “carry out an inspection”?',o:['Cancelar uma inspeção','Realizar uma inspeção','Encontrar uma inspeção'],a:1,e:'“Carry out” significa realizar ou executar.'},
{r:1,t:'Qual frase comunica claramente um achado?',o:['Something is bad there.','We identified corrosion on the lower panel.','The aircraft is not nice.'],a:1,e:'Um achado claro diz o que foi identificado e onde.'},
{r:1,t:'Complete: The technician ___ the damaged component yesterday.',o:['replaces','is replacing','replaced'],a:2,e:'“Yesterday” pede passado simples: replaced.'},
{r:2,t:'Qual é a melhor frase para um registro técnico?',o:['The filter was replaced and the system was tested.','We maybe did stuff with the filter.','The filter replacing and testing.'],a:0,e:'A frase registra ações concluídas de maneira objetiva.'},
{r:2,t:'Complete: A leak ___ found near the hydraulic line.',o:['were','was','is be'],a:1,e:'“A leak” é singular: “A leak was found”.'},
{r:2,t:'Qual registro inclui achado, ação e resultado?',o:['There was a problem.','A loose connector was found, secured, and tested. No further defects were observed.','We checked something and it was okay.'],a:1,e:'O registro identifica o achado, descreve a ação e informa o resultado.'},
{r:2,t:'O manual exige um teste após a instalação. Complete: The system ___ be tested.',o:['must','does not have to','must not'],a:0,e:'“Must” comunica uma exigência.'},
{r:2,t:'Há uma discrepância aberta. Qual frase comunica a proibição?',o:['The aircraft should be released.','The aircraft must not be released.','The aircraft does not have to be released.'],a:1,e:'“Must not” indica proibição. A decisão técnica depende sempre dos documentos aprovados.'},
{r:2,t:'Qual frase recomenda uma nova verificação?',o:['The connector should be checked again.','The connector must not be check again.','The connector is check again.'],a:0,e:'“Should be checked” expressa recomendação em estilo de relatório.'},
{r:3,t:'Compare: This crack is ___ than the one found yesterday.',o:['large','larger','largest'],a:1,e:'Ao comparar duas coisas, use o comparativo: larger than.'},
{r:3,t:'Complete: This is the ___ issue in the report.',o:['more serious','most serious','serious than'],a:1,e:'“The most serious” é o superlativo.'},
{r:3,t:'Uma atualização objetiva ao supervisor seria:',o:['I am currently inspecting the wiring. I will update the record after the test.','Me busy. Later report.','I inspected tomorrow and update yesterday.'],a:0,e:'A frase informa a tarefa atual e o próximo passo.'},
{r:3,t:'Escolha a collocation natural.',o:['make an inspection','carry out an inspection','do a decision'],a:1,e:'“Carry out an inspection” é uma combinação natural no contexto técnico.'},
{r:3,t:'Escreva um registro de 2–3 frases: uma trinca foi encontrada perto de um painel de acesso; a área foi identificada para inspeção adicional. Diga o achado e o próximo passo.',type:'write',model:'A crack was found near the access panel. The affected area was identified for further inspection. The next action must follow the applicable maintenance procedure.',e:'Confira se a resposta informa o achado, a localização e o próximo passo sem inventar uma liberação da aeronave.'},
{r:3,t:'Desafio oral: explique uma tarefa que você faz regularmente, uma que está fazendo agora e uma que concluiu ontem.',type:'write',model:'I inspect aircraft components regularly. I am checking a maintenance record now. Yesterday, I inspected a hydraulic line and reported the finding.',e:'Peça que cada aluno troque os exemplos por tarefas reais da própria função. Observe presente simples, contínuo e passado simples.'}
];let idx=-1,score=0,selected=null,seen=[],written=[];const el=document.getElementById('app');const labels=()=>document.getElementById('rounds').innerHTML=rounds.map((x,i)=>`<div class="round ${idx>=0&&q[Math.min(idx,q.length-1)].r===i?'active':''} ${idx>=0&&q[Math.min(idx,q.length-1)].r>i?'done':''}">${x}</div>`).join('');function render(){labels();if(idx<0){el.innerHTML=`<div class="eyebrow">Revisão interativa</div><h1>Missão no Hangar</h1><p>24 desafios sobre o inglês que usamos nas aulas: rotina, ações em andamento, passado, vocabulário técnico, relatórios e comunicação no hangar.</p><p>Respondam juntos ou cada um no próprio celular. Nas duas últimas questões, escrevam e comparem com o modelo — a professora conduz a correção.</p><div class="controls"><span class="small">Sem cadastro. O resultado fica apenas neste aparelho.</span><button class="btn" id="start">Começar missão</button></div>`;document.getElementById('start').onclick=()=>{idx=0;render()};return}if(idx>=q.length){el.innerHTML=`<div class="eyebrow">Missão concluída</div><h1>Revisão finalizada</h1><div class="score">${score} / 22</div><p>Acertos nas questões objetivas. As duas respostas abertas são corrigidas com a professora.</p><div class="feedback"><strong>Para revisar em voz alta:</strong> peça uma frase sobre rotina, outra sobre uma tarefa em andamento e um registro curto sobre uma tarefa concluída.</div><button class="btn" id="again">Jogar novamente</button>`;document.getElementById('again').onclick=()=>{idx=-1;score=0;seen=[];written=[];render()};return}let z=q[idx],done=!!seen[idx],isWrite=z.type==='write';el.innerHTML=`<div class="eyebrow">${rounds[z.r]} · Questão ${idx+1} de ${q.length}</div><div class="bar" role="progressbar" aria-valuenow="${idx}" aria-valuemin="0" aria-valuemax="${q.length}"><div style="width:${idx/q.length*100}%"></div></div><h1>${z.t}</h1>${isWrite?`<textarea class="answer" id="written" aria-label="Sua resposta" placeholder="Escreva sua resposta aqui..."></textarea><div class="controls"><span class="small">Resposta aberta · correção com a professora</span><button class="btn" id="reveal">Ver modelo</button></div>`:`<div class="options">${z.o.map((v,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div>`}<div id="feed"></div><div class="controls"><span class="small">${isWrite?'Responda antes de ver o modelo.':'Escolha uma resposta para continuar.'}</span><button class="btn" id="next" ${done?'':'disabled'}>${idx===q.length-1?'Ver resultado':'Próxima questão →'}</button></div>`;document.getElementById('next').onclick=()=>{idx++;render()};if(isWrite){document.getElementById('written').value=written[idx]||'';document.getElementById('written').oninput=e=>written[idx]=e.target.value;document.getElementById('reveal').onclick=()=>{seen[idx]=true;document.getElementById('feed').innerHTML=`<div class="feedback"><strong>Modelo possível:</strong><div class="model">${z.model}</div><br>${z.e}</div>`;document.getElementById('next').disabled=false;document.getElementById('reveal').disabled=true};return}document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(seen[idx])return;seen[idx]=true;let n=Number(b.dataset.choice);if(n===z.a)score++;document.querySelectorAll('[data-choice]').forEach(c=>{c.disabled=true;if(Number(c.dataset.choice)===z.a)c.classList.add('correct');else if(c===b)c.classList.add('wrong')});document.getElementById('feed').innerHTML=`<div class="feedback ${n===z.a?'':'bad'}"><strong>${n===z.a?'Correto!':'Boa tentativa.'}</strong> ${z.e}</div>`;document.getElementById('next').disabled=false})}render();
</script></body></html>
